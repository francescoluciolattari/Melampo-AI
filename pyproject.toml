[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melampo"
version = "0.1.0"
description = "Project Melampo baseline scaffold for multimodal clinical intuition research"
readme = "src/README.md"
requires-python = ">=3.12"
authors = [
  { name = "Francesco Lattari e altri" }
]
dependencies = [
  "cryptography>=42.0",
  "falkordblite>=0.10.0",
  "requests>=2.31",
  "pdf2image>=1.17",
  # DICOM is part of every case's intake (RM, TAC, RX, MOC...), not an
  # optional extra. pydicom >=3.0: apply_modality_lut/apply_voi_lut live in
  # pydicom.pixels only from 3.0. numpy: pydicom needs it for pixel data.
  # Pillow: declared explicitly rather than relied on transitively via
  # pdf2image. python-gdcm (Apache-2.0) decodes JPEG Lossless / JPEG-LS,
  # the common PACS compressions -- chosen over pylibjpeg-libjpeg, which is
  # GPLv3 and incompatible with distributing this BSL-1.1 project.
  "pydicom>=3.0",
  "numpy>=1.26",
  "Pillow>=10.0",
  "python-gdcm>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  # tests/test_bench_script.py parses the workflow YAML directly; PyYAML
  # was only ever declared under the `clinical` extra, so a clean
  # `pip install -e .[dev]` could not run the full suite.
  "PyYAML>=6.0",
]
# Data and model-weight management (see docs/environment_and_data.md):
# reference data is tracked by DVC, pinned to versioned upstream release
# URLs, and fetched with `uv run dvc update -R data` -- no storage remote is
# needed for public sources. A storage-remote plugin (dvc-s3, dvc-azure,
# dvc-gs) is added here once the project's remote is chosen.
data = [
  "dvc>=3.60",
]
# Model weights (see src/melampo/models/weights.py and melampo-storage.yaml):
# huggingface_hub downloads pinned revisions (backends upstream / hf_mirror)
# and uploads the private mirror. Not needed to pin revisions -- that uses
# the Hub's HTTP API through requests.
models = [
  "huggingface_hub>=0.34",
]
clinical = [
  "fhir.resources>=7.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
]
# document extra removed: Docling was replaced by Nemotron-Parse/LlamaParse
# (see docs/recursive_engine_decision_record.md); this declaration was left
# behind when the code was removed and is corrected here.
retrieval = [
  "weaviate-client>=4.5",
  "faiss-cpu>=1.8",
  "sentence-transformers>=2.6",
]
retrieval-milvus = [
  "pymilvus>=2.4",
]
imaging = [
  "pydicom>=3.0",
  "nibabel>=5.2",
  "SimpleITK>=2.3",
  "Pillow>=10.0",
  "opencv-python>=4.9",
  "monai>=1.3",
]
ml = [
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.40",
  "accelerate>=0.29",
  "einops>=0.7",
  "timm>=0.9",
  "scikit-learn>=1.4",
]
api = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]
quantum = [
  "qiskit>=1.0",
  "pennylane>=0.35",
]
viz = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tqdm>=4.66",
]
enterprise = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "fhir.resources>=7.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  # docling removed: it was replaced by Nemotron-Parse/LlamaParse and taken
  # out of the `document` extra, but was still installed from here.
  "weaviate-client>=4.5",
  "faiss-cpu>=1.8",
  "sentence-transformers>=2.6",
  "pydicom>=3.0",
  "nibabel>=5.2",
  "SimpleITK>=2.3",
  "Pillow>=10.0",
  "opencv-python>=4.9",
  "monai>=1.3",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.40",
  "accelerate>=0.29",
  "einops>=0.7",
  "timm>=0.9",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "qiskit>=1.0",
  "pennylane>=0.35",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tqdm>=4.66",
]

[project.scripts]
melampo-prototype = "melampo.cli:main"
melampo-prototype-cxr = "melampo.cli:main_cxr"
melampo-prototype-openi = "melampo.cli:main_openi"
melampo-weaviate-schema = "melampo.cli:main_weaviate_schema"
melampo-decision-record = "melampo.cli:main_decision_record"

[tool.uv]
# uv is the project's environment manager: `uv sync --extra dev --extra data`
# builds exactly the environment in uv.lock. Resolution is universal (one
# lock for Linux, macOS and Windows) and pinned to Python 3.12 via
# .python-version.
required-version = ">=0.9"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["melampo*"]

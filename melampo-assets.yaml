# Melampo -- asset manifest
#
# Everything the project uses that is not its own source code: reference
# data, knowledge sources, model weights, API models, external tools.
# For each asset: what it is, who manages it, where it comes from (pinned),
# its licence, which module consumes it, and its status.
#
# Managers:
#   uv   -- Python and every Python package (pyproject.toml + uv.lock)
#   dvc  -- data files and model weights (data/*.dvc; pinned by URL + md5)
#   git  -- small files the project generates itself
#   apt  -- system packages uv cannot provide (CI: .github/workflows/ci.yml)
#   api  -- models used through a remote API: nothing to download, only a key
#   weights -- model weights: pinned here (repo, revision, sha256 per file),
#              fetched from wherever melampo-storage.yaml points
#              (src/melampo/models/weights.py)
#
# Status values:
#   present          -- in the repository or fetched by `uv run dvc update -R data`
#   to_download      -- decided, fetched when a deployment needs it (weights: at deploy time)
#   to_integrate     -- needs code in this project before it can be used
#   blocked_decision -- waiting on a decision listed under `decisions_pending`
#   blocked_licence  -- cannot be used until a licence is obtained or reviewed
#
# Licences marked "verified" were read at the source on the date above;
# anything else says "to_verify" and must be checked before use in a
# regulated (MDR) product. tests/test_assets_manifest.py keeps this file
# consistent with the data/*.dvc pins.

version: 1
updated: "2026-09-26"

decisions_taken:
  - id: model-storage
    decided: "2026-09-26"
    decision: >-
      Phased, switched in one file (melampo-storage.yaml). Now: no storage;
      every model pinned here to an exact Hugging Face commit and the sha256
      of each file, fetched from upstream. First deployment: private copies
      of the pinned revisions in the project's own HF organisation. First
      training run: a DVC remote in an EU region for the weights the
      project produces. Every download is verified against the pinned
      sha256 whatever the backend. Git LFS on GitHub was rejected: 2 GB per
      file on Free/Pro plans and 10 GiB/month of storage and bandwidth
      included, so it cannot hold gpt-oss-120b and every CI checkout would
      spend the quota.

  - id: disease-identity
    decided: "2026-09-25"
    decision: Mondo is the disease-identity layer for common and rare diseases alike.

decisions_pending:
  - id: knowledge-all-diseases
    question: >-
      Which source(s) link all known diseases to their symptoms, and with
      what evidence weight? Disease identity is decided (Mondo); this is
      only about the symptom links Mondo does not carry.
    why_it_matters: >-
      phenotype.hpoa annotates rare diseases only (OMIM, Orphanet,
      DECIPHER). Out-of-range laboratory findings therefore lead to
      rare-disease candidates, and in the LLM branch (Nemotron/Gemma) a
      correct common-disease hypothesis has no graph node to be verified
      against, so the grounding checks mark it unsupported.
    how_it_is_decided: >-
      By measurement, not by each source's description of itself:
      .github/workflows/symptom-coverage.yml measures every candidate with
      a clean licence (HPO, Disease Ontology, NCIt through UMLS, Wikidata)
      on data/common_diseases_reference.tsv (141 common diseases). Offline
      part measured 2026-09-26 on the pinned releases: HPO 36/141 diseases
      with a link (21 with at least 5 findings), Disease Ontology axioms
      34/141 (14), all offline sources together 30/141 usable, 76/141 with
      no link at all. NCIt and Wikidata are measured in the workflow (they
      need UMLS_API_KEY and network access this environment lacks).
    blocks: [ncit, wikidata-symptoms, optimuskg, semmeddb, hsdn, text-mined-common-disease-hpo-annotations]

  - id: ncbi-case-corpus
    question: >-
      Should a scheduled workflow build/refresh a corpus of real clinical
      cases via pmc_case_reports.py now that NCBI_API_KEY is configured,
      and with what cadence, query terms and default licence group
      (LICENSE_COMMERCIAL vs LICENSE_NONCOMMERCIAL)?
    why_it_matters: >-
      The connector is already fully built and reads NCBI_API_KEY (see
      docs/pmc_connector_guide.md) -- nothing currently calls it
      automatically, unlike the literature refresh's four connectors.
      Wiring it into a workflow without a stated scope risks silently
      growing an uncurated evaluation corpus, the same reason the literature
      refresh is bounded to a fixed nightly batch rather than a full crawl.
    blocks: [pmc-case-reports]

  - id: tabular-labelled-data
    question: >-
      Which labelled dataset (laboratory panels with confirmed diagnoses)
      and which set of target diagnoses for the tabular ensemble?
    blocks: [tabicl-v2, autogluon]

  - id: git-history-rewrite
    question: >-
      Purge the HPO files (about 130 MB) from git history now that DVC
      tracks them? Requires rewriting history and a force push: every
      clone must be re-made. Not done; the files are only untracked going
      forward.
    blocks: []


    notes: >-
      Disease-identity layer (decisions_taken: disease-identity). Only xrefs
      Mondo marks MONDO:equivalentTo are followed to other sources -- the
      others are broader, narrower or obsolete, and following them would
      attach a rare subtype's annotations to a common disease.

  - id: disease-ontology
    kind: ontology
    manager: dvc
    status: present
    path: data/doid.owl
    source: https://raw.githubusercontent.com/DiseaseOntology/HumanDiseaseOntology/623d48bdf7634e21cb68ef400c81aff87b1fa796/src/ontology/releases/doid.owl
    version: "2026-08-31"
    licence: CC0 1.0 (verified, obofoundry.org/ontology/doid and the file's own header)
    consumers: [memory/symptom_sources.py, evaluation/symptom_coverage.py]
    notes: >-
      has_symptom (RO:0002452) axioms exist only in the OWL release, not in
      doid.obo: measured 873 diseases, 2,268 disease-symptom pairs. A further
      set appears only as "has_symptom <phrase>" in definition text (444
      definitions), extracted at a lower evidence tier. Pinned to a commit
      of the DO repository, not a moving branch. Entering the graph depends
      on knowledge-all-diseases.

  - id: symptom-ontology
    kind: ontology
    manager: dvc
    status: present
    path: data/symp.obo
    source: https://raw.githubusercontent.com/DiseaseOntology/SymptomOntology/7a295d9856d8ce1af613e5b53b6af84940260605/src/ontology/symp.obo
    version: "2026-07-30"
    licence: CC0 1.0 (verified, the file's own terms:license)
    consumers: [memory/symptom_sources.py]
    notes: Labels for the SYMP terms Disease Ontology's has_symptom axioms point at (1,020 terms).

  - id: ncit
    kind: terminology
    manager: api
    status: blocked_decision
    source: NCI Thesaurus through the UMLS UTS API (UMLS_API_KEY), sabs NCI
    licence: CC BY 4.0 (verified, evs.nci.nih.gov/license) -- attribution required; the name "NCI Thesaurus" may not be used for derivatives
    consumers: [connectors/umls.py, memory/symptom_sources.py]
    notes: >-
      Disease_Has_Finding (48,691 pairs in UMLS), Disease_May_Have_Finding
      (18,671) and Disease_Excludes_Finding (30,402) -- the last is negative
      evidence no other source here provides. NCI is a cancer institute:
      coverage of non-oncological common diseases is exactly what the
      coverage workflow measures. If adopted, the release itself can be
      downloaded from NCI EVS and pinned with DVC like HPO, instead of
      depending on live API calls.

  - id: wikidata-symptoms
    kind: knowledge_source
    manager: api
    status: blocked_decision
    source: Wikidata SPARQL endpoint, property P780 (symptoms and signs), keyed by Mondo (P5270) or DOID (P699)
    licence: CC0 1.0 (Wikidata's licence for structured data)
    consumers: [connectors/wikidata.py, memory/symptom_sources.py]
    notes: >-
      Community-edited. Statements with at least one reference enter tier 3,
      unreferenced ones tier 4; deprecated statements are excluded. If
      adopted, a dated dump would be pinned rather than querying live.

  - id: text-mined-common-disease-hpo-annotations
    kind: knowledge_source
    manager: dvc
    status: blocked_decision
    source: to_verify (Groza et al. 2015, AJHG 97:111 -- current availability of the file not confirmed)
    licence: article CC BY 4.0; annotation file to_verify
    consumers: [to_integrate]
    notes: >-
      3,145 common diseases, 132,006 HPO annotations -- but text-mined, mean
      precision 60-67% on a 41-disease curated sample. At most a low-tier
      source.

  - id: common-diseases-reference
    kind: generated
    manager: git
    status: present
    path: data/common_diseases_reference.tsv
    source: hand-compiled by the project, resolved against Mondo v2026-09-01
    licence: project's own
    consumers: [evaluation/symptom_coverage.py]
    notes: >-
      141 common diseases across 17 specialties; 131 resolved by Mondo label
      or exact synonym, 10 chosen by hand (marked "manual"). Not a
      prevalence-ranked sample: a coverage probe, not an epidemiological one.

  - id: optimuskg
    kind: knowledge_source
    manager: dvc
    status: blocked_decision
    source: https://doi.org/10.7910/DVN/IYNGEV
    licence: per source, including CC-BY-NC-SA components (verified statement, arXiv:2604.27269) -- review needed
    consumers: [to_integrate]
    notes: >-
      36,345 diseases; 157,144 disease-phenotype edges from HPO, MedDRA and
      Open Targets (Parquet). Successor of PrimeKG. Non-commercial parts may
      exclude it from a commercial product.

  - id: semmeddb
    kind: knowledge_source
    manager: dvc
    status: blocked_decision
    source: NLM, SemMedDB VER43_R
    licence: UMLS licence (verified) -- UMLS_API_KEY already used by the literature workflow
    consumers: [to_integrate]
    notes: >-
      Relations text-mined from all of PubMed, including disease
      manifestations. Final release May 2024, no longer maintained after
      2024-12-31. Machine-extracted: to enter the graph only with wide
      uncertainty bounds, never as curated evidence.

  - id: hsdn
    kind: knowledge_source
    manager: dvc
    status: blocked_licence
    source: Zhou, Menche, Barabasi & Sharma, "Human symptoms-disease network", Nature Communications 5:4212 (2014)
    licence: >-
      (c) 2014 Springer Nature Limited, all rights reserved (verified,
      nature.com/articles/ncomms5212) -- this article predates Nature
      Communications' 2016 shift to full CC BY; its supplementary data is
      not under an open licence. Explicit permission from Springer Nature
      would be needed before commercial/MDR use.
    consumers: [to_integrate]
    notes: >-
      By far the widest documented symptom coverage found so far: 4,219
      diseases (95.0% of MeSH disease terms), 322 symptom terms (98.5% of
      MeSH symptom terms), 147,978 weighted symptom-disease links, mined
      from MEDLINE co-occurrence and mapped to MeSH ids (a third-party
      redistribution exists at github.com/dhimmel/hsdn under CC0, but that
      licence covers only that repository's own additions, not the
      underlying Zhou et al. dataset it redistributes). The best-fitting
      candidate by coverage; blocked entirely on the licence, not on
      technical integration.

  - id: snomed-ct
    kind: terminology
    manager: dvc
    status: blocked_licence
    source: SNOMED International
    licence: >-
      Italy is not a SNOMED International Member (verified 2026-09-25,
      nlm.nih.gov/healthit/snomedct/snomed_licensing.html). The Affiliate
      Licence distributed with UMLS counts as use any act it permits
      performed in a Non-Member territory (clause 9.5) -- reading a relation
      through the API included -- and requires notice before use (9.3) and
      fees (7.1). A UMLS key does not change this. Exemption: a Qualifying
      Research Project (peer review, ethics approval, fixed timeframe,
      publication) pays no fees (Appendix B 1.9) -- possibly usable in a
      research phase, not for the commercial product.
    consumers: [to_integrate]
    notes: >-
      Not a symptom source even where licensed: SNOMED CT defines disorders
      by site, morphology and cause; disease-to-manifestation links exist
      only for a narrow subset ("has definitional manifestation").

  - id: loinc
    kind: terminology
    manager: dvc
    status: to_integrate
    source: loinc.org
    licence: >-
      Regenstrief LOINC License (verified 2026-09-25, loinc.org/kb/license)
      -- perpetual, royalty-free, explicit permission for "any commercial or
      non-commercial purpose", no geographic restriction (unlike SNOMED CT
      content bundled inside UMLS). Registration is required to download but
      does not gate use.
    consumers: [data/lab_results.py]
    notes: ROADMAP A3.2 -- laboratory analyte codes; today analytes keep their printed names.

  - id: umls
    kind: terminology
    manager: api
    status: present
    source: NLM UTS REST API (UMLS_API_KEY)
    licence: >-
      UMLS Metathesaurus License Agreement (verified, nlm.nih.gov) -- covers
      most bundled source vocabularies (RxNorm, MeSH, ICD-9-CM/ICD-10-CM,
      LOINC among them) for any licensee. SNOMED CT is the documented
      exception: bundled inside UMLS but still gated by SNOMED
      International's own Member/Affiliate terms for use outside Member
      countries (see snomed-ct) -- a UMLS key does not clear that
      restriction.
    consumers: [connectors/umls.py, memory/umls_cache.py]
    notes: >-
      crosswalk_from_hpo() bridges an HPO code to any vocabulary UMLS
      asserts a shared CUI with; already wired end-to-end
      (UmlsConfig.from_env(), build_umls_for_cascade()). A live,
      per-concept relations lookup (/content/{version}/CUI/{cui}/relations,
      e.g. "may_be_finding_of_disease") is a candidate way to source
      disease-symptom links through this same licensed key rather than a
      separate bulk dataset -- not yet implemented, and it still needs
      checking whether a relation sourced from SNOMED CT content inherits
      the same non-Member restriction when read live rather than bulk
      downloaded.


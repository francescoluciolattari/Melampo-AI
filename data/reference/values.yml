# Reference values (4 November 2026): what the models compare a measure with, instead of what they remember.
#
# Every row is knowledge with its source, not a boundary set by the project: the value, the population and the
# technique it holds for, where it is written (URL, section, reference number of the source), the licence of
# the source, and who checked it. Only the row's facts are here; the paragraphs of the sources are not
# committed (data/reference/README.md): a number with its citation is a fact, a paragraph is the author's work.
#
# status:
#   to_verify  read by Claude through a web reading of the page (a summarising fetch), not yet checked by a
#              person against the page itself: usable in the probes, not in clinical use
#   verified   checked against the page by a person (name, date)
#   reviewed   reviewed by a radiologist (name, date): the only status for clinical use
#
# Fields: id; structures (linker classes); aspect (length, diameter, thickness, volume, volume_index); detail
# (how it is measured); techniques (US, CT, MR, RX, XA, any); population (age, sex: male, female, any);
# normal (low, high: the normal range, either may be absent) or above (a value above it is abnormal); unit;
# above_means / below_means (the deviation, in the words of the source); source; status; checked_by;
# quoted (8 November 2026): the words of the page the row rests on, as a web reading quoted them when asked for
# the exact sentence, with the date. A quotation read through a web reading is not a person's check: the status
# stays to_verify until a person has read the page; the quotation says where to look and what to find there.
version: 2026-11-08

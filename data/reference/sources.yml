# The index of the sources (8 November 2026): the literature, textbooks, research and consolidated documentation
# Melampo reads, how each may be reached, and the documents found in them. memory/sources_index.py explains it.
# Kept up to date by hand (scripts/sources_mask.py, or scripts/sources_index.py add) and by the project's weekly
# search (workflow sources-index), which adds documents as candidates only.
#
# kind: database, journal, guideline, textbook, open_textbook, reference_site, terminology, document
# access: open, free_registration, subscription, institutional, public_domain, purchase
# status: in_use (rows or paragraphs come from it), available (reachable now, not yet used), to_register (a
#   person must register or subscribe first: how_to_reach says how), not_reachable, candidate (found by the
#   search, not yet read), rejected
# The terms of each publisher change: what is written here was read on the date in last_checked, and the
# publisher's own page decides. Reading a source lawfully does not by itself allow copying it: only facts with
# their citation go into the repository, never paragraphs of closed sources.

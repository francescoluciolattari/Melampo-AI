name: Owner probe (of what is the finding said?)

# Manual trigger only (31 October 2026; the statement reading and its sample, 1 November 2026). For every item of the two HPO samples (PARROT), the Kintsch reader
# alone and the reader with the models read whether the clause is about the structure the linker found or uses
# it to place something else (scripts/owner_probe.py, src/melampo/memory/finding_owner.py). PARROT is public
# (CC BY-NC-SA 4.0) and goes to OpenRouter only as such (--public-data); patients' reports never take this
# road. Billed calls: one or two per item and model (the reader's method, with one follow-up when the phrase
# is cut short). See docs-archive-2026-11:docs/linker/di_che_cosa_parla_la_frase_2026-10-31.md.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "OpenRouter model ids, comma-separated (empty = the reader alone)"
        required: false
        default: "google/gemma-4-31b-it,nvidia/nemotron-3-ultra-550b-a55b"
      sets:
        description: "samples: ctrate3 (CT-RATE, third sample, 9 Nov), ctrate2 (CT-RATE, second sample, 8 Nov, seen), ctrate (CT-RATE chest CT, 6 Nov, seen), claims4 (5 Nov, seen), claims3 (3 Nov, seen), claims2 (2 Nov, seen), claims (2 Nov, seen), statement (1 Nov, seen), fresh, dev, heldout"
        required: false
        default: "ctrate3"
      arms:
        description: "readings with the models: claims, statement, owner (each costs two calls per item)"
        required: false
        default: "claims"
      sample_only:
        description: "only draw the samples and upload them, for labelling before any reading (no model call)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked

      - name: UBERON (what is part of what), HPO and PATO (what is an abnormality)
        run: |
          curl -sSL --fail -o uberon.obo https://github.com/obophenotype/uberon/releases/latest/download/uberon.obo
          curl -sSL --fail -o hp-full.obo \
            https://github.com/obophenotype/human-phenotype-ontology/releases/latest/download/hp-full.obo
          curl -sSL --fail -o pato.obo https://raw.githubusercontent.com/pato-ontology/pato/master/pato.obo

      - name: PARROT reports and the three samples (the seeds of the labels)
        run: |
          git clone --quiet --depth 1 https://github.com/PARROT-reports/PARROT_v1.0.git ext/PARROT
          uv run --no-sync python scripts/hpo_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --out hpo_items.jsonl
          uv run --no-sync python scripts/hpo_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --seed 2026103102 --exclude data/gold/hpo_silver_2026-10-31/labels.txt --out hpo_items_heldout.jsonl
          uv run --no-sync python scripts/owner_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --out owner_items_fresh.jsonl
          uv run --no-sync python scripts/owner_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --seed 20261102 --out owner_items_statement.jsonl
          uv run --no-sync python scripts/owner_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --seed 20261103 --out owner_items_claims.jsonl
          uv run --no-sync python scripts/owner_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --seed 20261104 --out owner_items_claims2.jsonl
          uv run --no-sync python scripts/owner_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --seed 20261105 --out owner_items_claims3.jsonl
          uv run --no-sync python scripts/owner_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --seed 20261106 --per-structure 16 --out owner_items_claims4.jsonl

      # CT-RATE (6 November 2026): chest CT reports, CC BY-NC-SA 4.0, gated on Hugging Face. The terms are accepted
      # with the account whose read token is the secret HF_TOKEN. Only the validation reports (1,304 patients) are
      # used; the texts stay in the run and are never committed.
      - name: CT-RATE reports and their sample
        if: contains(inputs.sets, 'ctrate')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::the secret HF_TOKEN is needed for CT-RATE"; exit 2; fi
          curl -sSL --fail -H "Authorization: Bearer $HF_TOKEN" -o ctrate_validation_reports.csv \
            https://huggingface.co/datasets/ibrahimhamamci/CT-RATE/resolve/main/dataset/radiology_text_reports/validation_reports.csv
          uv run --no-sync python scripts/ctrate_corpus.py --csv ctrate_validation_reports.csv --out ctrate.jsonl
          uv run --no-sync python scripts/owner_probe.py sample --parrot ctrate.jsonl --seed 20261107 \
            --n-en 200 --n-it 0 --per-structure 16 --out owner_items_ctrate.jsonl
          # the second sample (7 November 2026): 300 items from reports the first did not use; with 0 to 1 errors
          # in 300, the 95% upper bound of an error share stays near or under 2%
          uv run --no-sync python scripts/owner_probe.py sample --parrot ctrate.jsonl --seed 20261108 \
            --n-en 300 --n-it 0 --per-structure 24 --out owner_items_ctrate2.jsonl
          # the third (9 November 2026): reports neither of the first two used
          uv run --no-sync python scripts/owner_probe.py sample --parrot ctrate.jsonl --seed 20261109 \
            --n-en 300 --n-it 0 --per-structure 24 --out owner_items_ctrate3.jsonl

      - name: Run the probe
        if: ${{ !inputs.sample_only }}
        env:
          MODELS: ${{ inputs.models }}
          SETS: ${{ inputs.sets }}
          ARMS: ${{ inputs.arms }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # Inputs go through the environment, never interpolated into the shell line.
        run: |
          MODELS="${MODELS//[[:space:]]/}"
          if [ -n "$MODELS" ] && ! [[ "$MODELS" =~ ^[A-Za-z0-9._:-]+/[A-Za-z0-9._:-]+(,[A-Za-z0-9._:-]+/[A-Za-z0-9._:-]+)*$ ]]; then
            echo "::error::models takes ids like org/name, comma-separated"; exit 2
          fi
          ITEMS=()
          for name in ${SETS//,/ }; do
            case "$name" in
              ctrate) ITEMS+=(--items ctrate=owner_items_ctrate.jsonl --corpus ctrate.jsonl) ;;
              ctrate2) ITEMS+=(--items ctrate2=owner_items_ctrate2.jsonl --corpus ctrate.jsonl) ;;
              ctrate3) ITEMS+=(--items ctrate3=owner_items_ctrate3.jsonl --corpus ctrate.jsonl) ;;
              claims4) ITEMS+=(--items claims4=owner_items_claims4.jsonl) ;;
              claims3) ITEMS+=(--items claims3=owner_items_claims3.jsonl) ;;
              claims2) ITEMS+=(--items claims2=owner_items_claims2.jsonl) ;;
              claims) ITEMS+=(--items claims=owner_items_claims.jsonl) ;;
              statement) ITEMS+=(--items statement=owner_items_statement.jsonl) ;;
              fresh) ITEMS+=(--items fresh=owner_items_fresh.jsonl) ;;
              dev) ITEMS+=(--items dev=hpo_items.jsonl) ;;
              heldout) ITEMS+=(--items heldout=hpo_items_heldout.jsonl) ;;
              *) echo "::error::unknown set $name"; exit 2 ;;
            esac
          done
          SKIP=""
          for arm in owner statement claims; do
            [[ ",${ARMS// /}," == *",$arm,"* ]] || SKIP="$SKIP,$arm"
          done
          uv run --no-sync python -u scripts/owner_probe.py "${ITEMS[@]}" --models "$MODELS" --skip "${SKIP#,}" \
            --parrot ext/PARROT/data/PARROT_v1_0.jsonl --uberon uberon.obo --hpo hp-full.obo --pato pato.obo \
            --endpoint https://openrouter.ai/api/v1/chat/completions --public-data \
            --cache owner_probe_answers.jsonl --questions owner_questions.jsonl --out owner_probe.json 2> >(tee owner_probe.log >&2) | tee owner_probe_summary.json

      - name: Summarise
        if: always()
        run: |
          { echo "Branch \`${GITHUB_REF_NAME}\`, commit \`${GITHUB_SHA::7}\`"; echo; echo '```json'
            if [ -f owner_probe_summary.json ]; then head -c 60000 owner_probe_summary.json; fi; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The report holds sentences of a non-commercial corpus: the artifact is short-lived and is not committed.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-probe
          retention-days: 7
          path: |
            owner_probe.json
            owner_probe_summary.json
            owner_probe.log
            owner_probe_answers.jsonl
            owner_questions.jsonl
            owner_items_ctrate.jsonl
            owner_items_ctrate2.jsonl
            owner_items_ctrate3.jsonl

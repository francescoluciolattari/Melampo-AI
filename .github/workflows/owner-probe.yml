name: Owner probe (of what is the finding said?)

# Manual trigger only (31 October 2026; the statement reading and its sample, 1 November 2026). For every item of the two HPO samples (PARROT), the Kintsch reader
# alone and the reader with the models read whether the clause is about the structure the linker found or uses
# it to place something else (scripts/owner_probe.py, src/melampo/memory/finding_owner.py). PARROT is public
# (CC BY-NC-SA 4.0) and goes to OpenRouter only as such (--public-data); patients' reports never take this
# road. Billed calls: one or two per item and model (the reader's method, with one follow-up when the phrase
# is cut short). See docs-archive-2026-11:docs/linker/di_che_cosa_parla_la_frase_2026-10-31.md.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "OpenRouter model ids, comma-separated (empty = the reader alone)"
        required: false
        default: "google/gemma-4-31b-it,nvidia/nemotron-3-ultra-550b-a55b+reasoning,meta/muse-spark-open+reasoning"
      sets:
        description: "samples: ctrate9 (CT-RATE training reports, ninth sample, 13 Nov), ctrate8 (training reports, eighth, seen), ctrate7 (CT-RATE, seventh sample, 13 Nov, seen), ctrate6 (CT-RATE, sixth sample, 11 Nov, seen), ctrate5 (CT-RATE, fifth sample, 11 Nov, seen), ctrate4 (CT-RATE, fourth sample, 10 Nov, seen), ctrate3 (CT-RATE, third sample, 9 Nov, seen), ctrate2 (CT-RATE, second sample, 8 Nov, seen), ctrate (CT-RATE chest CT, 6 Nov, seen), claims4 (5 Nov, seen), claims3 (3 Nov, seen), claims2 (2 Nov, seen), claims (2 Nov, seen), statement (1 Nov, seen), fresh, dev, heldout"
        required: false
        default: "ctrate9"
      arms:
        description: "readings with the models: claims, statement, owner (each costs two calls per item)"
        required: false
        default: "claims"
      second_labeller:
        description: "with sample_only: the model that labels the samples independently (none of the readers)"
        required: false
        default: "mistralai/mistral-large-4-0"
      only_items:
        description: "a diagnosis on seen items: only these item ids, comma-separated (no measure)"
        required: false
        default: ""
      sample_only:
        description: "only draw the samples and upload them, for labelling before any reading (no reading call)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # 240 minutes (12 November 2026): the second labeller's model answers slowly; 120 were not enough
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked

      - name: UBERON (what is part of what), HPO and PATO (what is an abnormality)
        run: |
          curl -sSL --fail -o uberon.obo https://github.com/obophenotype/uberon/releases/latest/download/uberon.obo
          curl -sSL --fail -o hp-full.obo \
            https://github.com/obophenotype/human-phenotype-ontology/releases/latest/download/hp-full.obo
          curl -sSL --fail -o pato.obo https://raw.githubusercontent.com/pato-ontology/pato/master/pato.obo

      - name: PARROT reports and the three samples (the seeds of the labels)
        # the samples labelled before 12 November 2026 are drawn as they were (the finder of names of that day:
        # a name could cross a parenthesis, a class of a finding was a site); fingerprints check every item
        env:
          MELAMPO_FINDER: "2026-11-11"
        run: |
          git clone --quiet --depth 1 https://github.com/PARROT-reports/PARROT_v1.0.git ext/PARROT
          uv run --no-sync python scripts/hpo_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --out hpo_items.jsonl
          uv run --no-sync python scripts/hpo_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --seed 2026103102 --exclude data/gold/hpo_silver_2026-10-31/labels.txt --out hpo_items_heldout.jsonl
          uv run --no-sync python scripts/owner_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --out owner_items_fresh.jsonl
          uv run --no-sync python scripts/owner_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --seed 20261102 --out owner_items_statement.jsonl
          uv run --no-sync python scripts/owner_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --seed 20261103 --out owner_items_claims.jsonl
          uv run --no-sync python scripts/owner_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --seed 20261104 --out owner_items_claims2.jsonl
          uv run --no-sync python scripts/owner_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --seed 20261105 --out owner_items_claims3.jsonl
          uv run --no-sync python scripts/owner_probe.py sample --parrot ext/PARROT/data/PARROT_v1_0.jsonl \
            --seed 20261106 --per-structure 16 --out owner_items_claims4.jsonl

      # CT-RATE (6 November 2026): chest CT reports, CC BY-NC-SA 4.0, gated on Hugging Face. The terms are accepted
      # with the account whose read token is the secret HF_TOKEN. Only the validation reports (1,304 patients) are
      # used; the texts stay in the run and are never committed.
      - name: CT-RATE reports and their sample
        if: contains(inputs.sets, 'ctrate')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SETS: ${{ inputs.sets }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::the secret HF_TOKEN is needed for CT-RATE"; exit 2; fi
          curl -sSL --fail -H "Authorization: Bearer $HF_TOKEN" -o ctrate_validation_reports.csv \
            https://huggingface.co/datasets/ibrahimhamamci/CT-RATE/resolve/main/dataset/radiology_text_reports/validation_reports.csv
          uv run --no-sync python scripts/ctrate_corpus.py --csv ctrate_validation_reports.csv --out ctrate.jsonl
          export MELAMPO_FINDER=2026-11-11   # the samples labelled before 12 November 2026, drawn as they were
          uv run --no-sync python scripts/owner_probe.py sample --parrot ctrate.jsonl --seed 20261107 \
            --n-en 200 --n-it 0 --per-structure 16 --out owner_items_ctrate.jsonl
          # the second sample (7 November 2026): 300 items from reports the first did not use; with 0 to 1 errors
          # in 300, the 95% upper bound of an error share stays near or under 2%
          uv run --no-sync python scripts/owner_probe.py sample --parrot ctrate.jsonl --seed 20261108 \
            --n-en 300 --n-it 0 --per-structure 24 --out owner_items_ctrate2.jsonl
          # the third (9 November 2026): reports neither of the first two used
          uv run --no-sync python scripts/owner_probe.py sample --parrot ctrate.jsonl --seed 20261109 \
            --n-en 300 --n-it 0 --per-structure 24 --out owner_items_ctrate3.jsonl
          # the fourth (10 November 2026): the uncertainty of the report as one category; reports none of the first
          # three used
          uv run --no-sync python scripts/owner_probe.py sample --parrot ctrate.jsonl --seed 20261110 \
            --n-en 300 --n-it 0 --per-structure 24 --out owner_items_ctrate4.jsonl
          # the fifth (11 November 2026): the level of every uncertainty; reports none of the first four used
          uv run --no-sync python scripts/owner_probe.py sample --parrot ctrate.jsonl --seed 20261111 \
            --n-en 300 --n-it 0 --per-structure 24 --out owner_items_ctrate5.jsonl
          # the sixth (11 November 2026): the uncertainty as the literature tells it apart; reports none of the
          # first five used; drawn with the finder of 12 November (no name across a parenthesis; a class of a
          # finding gives its site to its structure, read from UBERON and HPO: hp-full.obo)
          export MELAMPO_FINDER=2026-11-12 MELAMPO_HPO_OBO=hp-full.obo
          uv run --no-sync python scripts/owner_probe.py sample --parrot ctrate.jsonl --seed 20261112 \
            --n-en 300 --n-it 0 --per-structure 24 --out owner_items_ctrate6.jsonl
          # the seventh (13 November 2026): the qualifying words with what they do, the uncertainty that bears on
          # the structure, the measure of what is seen, the parts from UBERON; reports none of the first six used;
          # drawn with the same finder as the sixth
          uv run --no-sync python scripts/owner_probe.py sample --parrot ctrate.jsonl --seed 20261113 \
            --n-en 300 --n-it 0 --per-structure 24 --out owner_items_ctrate7.jsonl
          # the eighth (13 November 2026), from the training reports (another 20,000 patients: the validation
          # reports left by the first seven hold only 8 structures); ids ctrate-train-N, never a validation id
          if [[ ",${SETS}," == *",ctrate8,"* || ",${SETS}," == *",ctrate9,"* ]]; then
            curl -sSL --fail -H "Authorization: Bearer $HF_TOKEN" -o ctrate_train_reports.csv \
              https://huggingface.co/datasets/ibrahimhamamci/CT-RATE/resolve/main/dataset/radiology_text_reports/train_reports.csv
            uv run --no-sync python scripts/ctrate_corpus.py --csv ctrate_train_reports.csv --prefix ctrate-train \
              --out ctrate_train.jsonl
            uv run --no-sync python scripts/owner_probe.py sample --parrot ctrate_train.jsonl --seed 20261114 \
              --n-en 300 --n-it 0 --per-structure 24 --out owner_items_ctrate8.jsonl
            # the ninth (13 November 2026): training reports the eighth did not use
            uv run --no-sync python scripts/owner_probe.py sample --parrot ctrate_train.jsonl --seed 20261115 \
              --n-en 300 --n-it 0 --per-structure 24 --out owner_items_ctrate9.jsonl
          fi

      # 11 November 2026: a second, independent labeller, against errors of labelling (double annotation with
      # adjudication, as BioScope was made). Its labels are compared with the first labeller's only after those
      # are committed, and every disagreement is re-read before the readers run.
      # the second labeller's answers are kept between runs (12 November 2026): a run that stops part-way asks
      # again only the items still without an answer. They are labels of public sentences, never patients'.
      - name: Restore the second labeller's answers
        if: ${{ inputs.sample_only && inputs.second_labeller != '' }}
        uses: actions/cache/restore@v4
        with:
          path: second_labeller_answers.jsonl
          key: second-labeller-${{ inputs.sets }}-${{ inputs.second_labeller }}-${{ github.run_id }}
          restore-keys: second-labeller-${{ inputs.sets }}-${{ inputs.second_labeller }}-

      - name: Second labeller
        if: ${{ inputs.sample_only && inputs.second_labeller != '' }}
        timeout-minutes: 200
        env:
          SETS: ${{ inputs.sets }}
          SECOND: ${{ inputs.second_labeller }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          SECOND="${SECOND//[[:space:]]/}"
          if ! [[ "$SECOND" =~ ^[A-Za-z0-9._:-]+/[A-Za-z0-9._:-]+$ ]]; then
            echo "::error::second_labeller takes an id like org/name"; exit 2
          fi
          for name in ${SETS//,/ }; do
            [ -f "owner_items_${name}.jsonl" ] || continue
            uv run --no-sync python scripts/second_labeller.py label --items "owner_items_${name}.jsonl" \
              --set "$name" --model "$SECOND" --endpoint https://openrouter.ai/api/v1/chat/completions \
              --public-data --out "second_labels_${name}.txt" 2> >(tee -a second_labeller.log >&2)
          done

      - name: Keep the second labeller's answers
        if: ${{ always() && inputs.sample_only && inputs.second_labeller != '' }}
        uses: actions/cache/save@v4
        with:
          path: second_labeller_answers.jsonl
          key: second-labeller-${{ inputs.sets }}-${{ inputs.second_labeller }}-${{ github.run_id }}

      # the readers' answers are kept between runs (14 November 2026): a run stopped by the credit asks again, after
      # it is topped up, only what is missing; the cache is keyed by the samples and the models
      - name: Restore the readers' answers
        if: ${{ !inputs.sample_only }}
        uses: actions/cache/restore@v4
        with:
          path: owner_probe_answers.jsonl
          key: owner-answers-${{ inputs.sets }}-${{ hashFiles('src/melampo/evaluation/llm_reading.py', 'src/melampo/memory/finding_owner.py', 'data/reading/manual.md') }}-${{ github.run_id }}
          restore-keys: owner-answers-${{ inputs.sets }}-${{ hashFiles('src/melampo/evaluation/llm_reading.py', 'src/melampo/memory/finding_owner.py', 'data/reading/manual.md') }}-

      - name: Run the probe
        if: ${{ !inputs.sample_only }}
        env:
          MODELS: ${{ inputs.models }}
          ONLY: ${{ inputs.only_items }}
          SETS: ${{ inputs.sets }}
          ARMS: ${{ inputs.arms }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # Inputs go through the environment, never interpolated into the shell line.
        run: |
          MODELS="${MODELS//[[:space:]]/}"
          if [ -n "$MODELS" ] && ! [[ "$MODELS" =~ ^[A-Za-z0-9._:-]+/[A-Za-z0-9._:-]+(\+reasoning)?(,[A-Za-z0-9._:-]+/[A-Za-z0-9._:-]+(\+reasoning)?)*$ ]]; then
            echo "::error::models takes ids like org/name (or org/name+reasoning), comma-separated"; exit 2
          fi
          ONLY="${ONLY//[[:space:]]/}"
          if [ -n "$ONLY" ] && ! [[ "$ONLY" =~ ^[A-Za-z0-9._-]+(,[A-Za-z0-9._-]+)*$ ]]; then
            echo "::error::only_items takes item ids, comma-separated"; exit 2
          fi
          ITEMS=()
          for name in ${SETS//,/ }; do
            case "$name" in
              ctrate) ITEMS+=(--items ctrate=owner_items_ctrate.jsonl --corpus ctrate.jsonl) ;;
              ctrate2) ITEMS+=(--items ctrate2=owner_items_ctrate2.jsonl --corpus ctrate.jsonl) ;;
              ctrate3) ITEMS+=(--items ctrate3=owner_items_ctrate3.jsonl --corpus ctrate.jsonl) ;;
              ctrate4) ITEMS+=(--items ctrate4=owner_items_ctrate4.jsonl --corpus ctrate.jsonl) ;;
              ctrate5) ITEMS+=(--items ctrate5=owner_items_ctrate5.jsonl --corpus ctrate.jsonl) ;;
              ctrate6) ITEMS+=(--items ctrate6=owner_items_ctrate6.jsonl --corpus ctrate.jsonl) ;;
              ctrate7) ITEMS+=(--items ctrate7=owner_items_ctrate7.jsonl --corpus ctrate.jsonl) ;;
              ctrate8) ITEMS+=(--items ctrate8=owner_items_ctrate8.jsonl --corpus ctrate_train.jsonl) ;;
              ctrate9) ITEMS+=(--items ctrate9=owner_items_ctrate9.jsonl --corpus ctrate_train.jsonl) ;;
              claims4) ITEMS+=(--items claims4=owner_items_claims4.jsonl) ;;
              claims3) ITEMS+=(--items claims3=owner_items_claims3.jsonl) ;;
              claims2) ITEMS+=(--items claims2=owner_items_claims2.jsonl) ;;
              claims) ITEMS+=(--items claims=owner_items_claims.jsonl) ;;
              statement) ITEMS+=(--items statement=owner_items_statement.jsonl) ;;
              fresh) ITEMS+=(--items fresh=owner_items_fresh.jsonl) ;;
              dev) ITEMS+=(--items dev=hpo_items.jsonl) ;;
              heldout) ITEMS+=(--items heldout=hpo_items_heldout.jsonl) ;;
              *) echo "::error::unknown set $name"; exit 2 ;;
            esac
          done
          SKIP=""
          for arm in owner statement claims; do
            [[ ",${ARMS// /}," == *",$arm,"* ]] || SKIP="$SKIP,$arm"
          done
          uv run --no-sync python -u scripts/owner_probe.py "${ITEMS[@]}" --models "$MODELS" --skip "${SKIP#,}" --only "$ONLY" \
            --parrot ext/PARROT/data/PARROT_v1_0.jsonl --uberon uberon.obo --hpo hp-full.obo --pato pato.obo \
            --endpoint https://openrouter.ai/api/v1/chat/completions --public-data \
            --cache owner_probe_answers.jsonl --questions owner_questions.jsonl --out owner_probe.json 2> >(tee owner_probe.log >&2) | tee owner_probe_summary.json
          # every pair of readers (13 November 2026): with three or more models, each pair of two different models
          # is measured again on the answers this run already gave (--replay: nothing is asked, nothing is paid),
          # so the pairs are compared on the same answers; the rule that chooses is in VALIDATION
          IFS=',' read -ra M <<< "$MODELS"
          if [ "${#M[@]}" -ge 3 ]; then
            n=0
            for ((i = 0; i < ${#M[@]}; i++)); do
              for ((j = i + 1; j < ${#M[@]}; j++)); do
                [ "${M[i]%%+*}" = "${M[j]%%+*}" ] && continue    # the same model with and without reasoning
                n=$((n + 1))
                echo "pair $n: ${M[i]},${M[j]}" | tee -a owner_probe_pairs.txt
                uv run --no-sync python -u scripts/owner_probe.py "${ITEMS[@]}" --models "${M[i]},${M[j]}" --replay \
                  --skip "${SKIP#,}" --only "$ONLY" --parrot ext/PARROT/data/PARROT_v1_0.jsonl --uberon uberon.obo \
                  --hpo hp-full.obo --pato pato.obo --cache owner_probe_answers.jsonl \
                  --out "owner_probe_pair_${n}.json" > "owner_probe_pair_${n}_summary.json" 2>> owner_probe_pairs.log
              done
            done
          fi

      - name: Keep the readers' answers
        if: ${{ always() && !inputs.sample_only }}
        uses: actions/cache/save@v4
        with:
          path: owner_probe_answers.jsonl
          key: owner-answers-${{ inputs.sets }}-${{ hashFiles('src/melampo/evaluation/llm_reading.py', 'src/melampo/memory/finding_owner.py', 'data/reading/manual.md') }}-${{ github.run_id }}

      - name: Summarise
        if: always()
        run: |
          { echo "Branch \`${GITHUB_REF_NAME}\`, commit \`${GITHUB_SHA::7}\`"; echo; echo '```json'
            if [ -f owner_probe_summary.json ]; then head -c 60000 owner_probe_summary.json; fi; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The report holds sentences of a non-commercial corpus: the artifact is short-lived and is not committed.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-probe
          retention-days: 7
          path: |
            owner_probe.json
            owner_probe_summary.json
            owner_probe.log
            owner_probe_answers.jsonl
            owner_questions.jsonl
            owner_probe_pairs.txt
            owner_probe_pairs.log
            owner_probe_pair_*.json
            owner_items_ctrate.jsonl
            owner_items_ctrate2.jsonl
            owner_items_ctrate3.jsonl
            owner_items_ctrate4.jsonl
            owner_items_ctrate5.jsonl
            owner_items_ctrate6.jsonl
            owner_items_ctrate7.jsonl
            owner_items_ctrate8.jsonl
            owner_items_ctrate9.jsonl
            second_labels_*.txt
            second_labeller.log
            second_labeller_answers.jsonl

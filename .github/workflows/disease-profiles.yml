name: disease-profiles

# The pilot of the disease profiles (15 November 2026): ten diagnoses written before the run; every link from a
# curated source or a publication open for use (Wikipedia only as an index of the publications it cites); the
# reading measured against curated profiles of rare diseases (--gold).
# The run stops before the budget; the cost of every call is the one OpenRouter reports.

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "USD, the run stops before passing it"
        default: "1.5"
      diagnoses:
        description: "comma-separated; empty = the ten of the pilot"
        default: ""
      gold:
        description: "rare diseases read to measure the reading against curated profiles (0: none)"
        default: "5"
      statpearls:
        description: "also StatPearls (CC BY-NC-ND, research only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The open sources
        run: |
          set -e
          curl -sSL --fail -o mondo.obo https://purl.obolibrary.org/obo/mondo.obo
          curl -sSL --fail -o hp.obo https://purl.obolibrary.org/obo/hp.obo
          curl -sSL --fail -o phenotype.hpoa \
            https://github.com/obophenotype/human-phenotype-ontology/releases/latest/download/phenotype.hpoa
          curl -sSL --fail -o doid.owl https://purl.obolibrary.org/obo/doid.owl
          curl -sSL --fail -o symp.obo https://purl.obolibrary.org/obo/symp.obo
      - name: Pilot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # a failure of the script fails the job (19 November 2026: through "| tee" a run that stopped at once ended
        # green, after 20 seconds, with no artifact and no reason given); the log always goes in the artifact
        run: |
          set -o pipefail
          mkdir -p out
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "The secret OPENROUTER_API_KEY is empty or missing: nothing can be read." | tee out/run.log
            exit 1
          fi
          ls -la mondo.obo hp.obo phenotype.hpoa doid.owl symp.obo | tee out/run.log
          extra=""
          if [ "${{ github.event.inputs.statpearls }}" = "true" ]; then extra="--statpearls"; fi
          diagnoses="${{ github.event.inputs.diagnoses }}"
          if [ -n "$diagnoses" ]; then extra="$extra --diagnoses"; fi
          python3 scripts/disease_profiles.py --mondo mondo.obo --hpo hp.obo --hpoa phenotype.hpoa \
            --doid-owl doid.owl --symp symp.obo --budget "${{ github.event.inputs.budget }}" --gold "${{ github.event.inputs.gold }}" \
            --out out/profiles.json $extra ${diagnoses:+"$diagnoses"} 2>&1 | tee -a out/run.log "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disease-profiles
          path: out
          if-no-files-found: error
          retention-days: 30

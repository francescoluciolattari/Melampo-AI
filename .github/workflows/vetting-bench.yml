name: Vetting bench (diagnostic engine candidates)

# Version 3 (14 November 2026, scripts/run_mechanism_bench.py): each case lists the mechanisms medicine accepts,
# looked up in HPO, GO, MONDO and ChEBI; a claim that names one is right without a judge, any other is read by two
# judges of other families than the candidate, shown the sources, and they must agree (a disagreement is a doubt).
# The candidate states the link as known, possible or none; the errors are the confident ones.
# Version 2 (run_vetting_bench.py, a curated graph of thirty edges) is kept but no longer run here.

on:
  workflow_dispatch:
    inputs:
      roster:
        description: "Comma-separated candidates"
        required: false
        default: "nemotron-3-ultra,gemma-4-31b"
      judges:
        description: "Two judge models, of other families than every candidate"
        required: false
        default: "mistral-large-openrouter,gpt-oss-120b"
      trials:
        description: "Times each case is asked"
        required: false
        default: "2"

jobs:
  prepare:
    name: List candidates and resolve the cases in the sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidates: ${{ steps.list.outputs.candidates }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: |
          uv sync --locked
      - id: list
        run: |
          echo "candidates=$(uv run python scripts/run_mechanism_bench.py \
            --list-candidates --roster '${{ inputs.roster }}')" >> "$GITHUB_OUTPUT"
      - name: The sources (HPO, GO, MONDO, ChEBI)
        run: |
          mkdir -p sources
          curl -sSL --fail -o sources/hp.obo https://github.com/obophenotype/human-phenotype-ontology/releases/latest/download/hp.obo
          curl -sSL --fail -o sources/go.obo https://purl.obolibrary.org/obo/go/go-basic.obo
          curl -sSL --fail -o sources/mondo.obo https://purl.obolibrary.org/obo/mondo.obo
          curl -sSL --fail -o sources/chebi.obo https://purl.obolibrary.org/obo/chebi/chebi_lite.obo
          ls -la sources
      - name: What each case's accepted mechanisms resolve to (no model is asked)
        run: |
          uv run python scripts/run_mechanism_bench.py --resolution-only --sources sources/*.obo \
            --out resolution.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: vetting-sources
          path: |
            sources/
            resolution.json
          retention-days: 7

  bench:
    name: Vet ${{ matrix.candidate }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ contains(matrix.candidate, '-reasoning') && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJson(needs.prepare.outputs.candidates) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: |
          uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          name: vetting-sources
      - name: Vet this candidate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JUDGES: ${{ inputs.judges }}
          TRIALS: ${{ inputs.trials }}
        continue-on-error: true
        run: |
          case "$TRIALS" in ''|*[!0-9]*) echo "::error::trials must be a number"; exit 2 ;; esac
          uv run python scripts/run_mechanism_bench.py --candidate "${{ matrix.candidate }}" \
            --judges "$JUDGES" --trials "$TRIALS" --sources sources/*.obo --out result.json
      - name: Upload this candidate's result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vetting-result-${{ strategy.job-index }}
          path: result.json
          retention-days: 90
          if-no-files-found: warn

  combine:
    name: Combine results
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vetting-result-*
          path: all_results
          merge-multiple: false
      - name: Merge into one report
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          results, skipped, meta = [], [], {}
          for path in sorted(pathlib.Path("all_results").rglob("*.json")):
              try:
                  payload = json.loads(path.read_text())
              except (OSError, json.JSONDecodeError) as error:
                  skipped.append(f"{path}: {error}")
                  continue
              if payload.get("status") == "completed":
                  results.extend(payload.get("results", []))
                  meta = {k: payload.get(k) for k in ("judges", "sources", "resolution")}
              else:
                  skipped.append(f"{payload.get('candidate')}: {payload.get('reason', payload.get('status'))}")
          results.sort(key=lambda r: (r["errors"], -r["right_rate"], r["doubts"], r.get("mean_latency_seconds") or 0))
          pathlib.Path("vetting_results.json").write_text(json.dumps(
              {"status": "completed" if results else "no_candidates", "results": results, "skipped": skipped, **meta},
              indent=2))
          print("### Vetting bench v3: mechanisms judged by the sources\n")
          print(f"Judges: {meta.get('judges')}\n")
          print("| Candidate | Errors | Right | Hedged right | Miss | Doubts | Runs |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          for r in results:
              o = r["outcomes"]
              print(f"| {r['model_name']} | {r['errors']} | {o.get('right', 0)} | {o.get('right_hedged', 0)} | "
                    f"{o.get('miss', 0)} | {r['doubts']} | {r['runs']} |")
          for line in skipped:
              print(f"\nSkipped: {line}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vetting-bench-results
          path: vetting_results.json
          retention-days: 90

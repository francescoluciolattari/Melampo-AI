name: Data and dependency updates

# Checks whether the HPO data releases in data/ and the project's Python
# dependencies have newer versions available, and opens a pull request when
# they do -- never committing to main directly.
#
# The central design choice: this workflow *proposes*, it does not update.
# The data files here are a clinical knowledge base. A release that renames
# 40 terms and obsoletes 29 (the 2026-02-16 HPO release did exactly that)
# changes what every downstream comparison matches, and a silently applied
# refresh would move those numbers with no reviewer having seen the diff. A
# pull request makes the change reviewable, and the full test suite runs
# against the new data before anyone merges it.
#
# Scheduled weekly and runnable on demand, as requested.

on:
  schedule:
    # Mondays at 06:00 UTC: HPO data and dependencies. HPO releases roughly
    # every 6-10 weeks -- a daily check would be almost entirely no-ops, and
    # each no-op still costs a checkout of a 130 MB data set.
    - cron: "0 6 * * 1"
    # Daily at 05:00 UTC: literature. PubMed and ClinicalTrials.gov content
    # appears daily, at a genuinely different rate from HPO releases, so it
    # gets its own schedule rather than sharing the weekly one -- one cron
    # per source cadence, not one compromise cadence for both.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      check_data:
        description: "Check HPO data releases"
        type: boolean
        default: true
      check_dependencies:
        description: "Check Python dependencies"
        type: boolean
        default: true
      check_literature:
        description: "Refresh literature for tracked concepts"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    # Runs on the weekly cron or on manual dispatch -- but not on the daily
    # literature cron, which shares this workflow file but must not trigger
    # an HPO/dependency check every day. github.event.schedule carries which
    # cron string triggered this run.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine the current and latest HPO release
        id: hpo
        if: ${{ github.event_name == 'schedule' || inputs.check_data }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, urllib.request, pathlib, re

          # The release currently in the repository, read from the data
          # itself rather than from a version file someone has to remember
          # to update. phenotype.hpoa carries its own release date in a
          # header comment.
          current = "unknown"
          hpoa = pathlib.Path("data/phenotype.hpoa")
          if hpoa.is_file():
              with hpoa.open(encoding="utf-8", errors="ignore") as handle:
                  for _ in range(20):
                      line = handle.readline()
                      if not line.startswith("#"):
                          break
                      match = re.search(r"(\d{4}-\d{2}-\d{2})", line)
                      if match:
                          current = match.group(1)
                          break

          latest, error = "unknown", ""
          try:
              request = urllib.request.Request(
                  "https://api.github.com/repos/obophenotype/human-phenotype-ontology/releases/latest",
                  headers={"Accept": "application/vnd.github+json", "User-Agent": "melampo-update-check"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  latest = json.loads(response.read()).get("tag_name", "unknown").lstrip("v")
          except Exception as exc:  # network failures must not fail the run
              error = str(exc)[:200]

          print(f"current={current}")
          print(f"latest={latest}")
          print(f"error={error}")
          print(f"outdated={'true' if latest not in ('unknown', current) and not error else 'false'}")
          PY

      - name: Download the newer HPO release
        if: steps.hpo.outputs.outdated == 'true'
        env:
          TAG: ${{ steps.hpo.outputs.latest }}
        run: |
          set -euo pipefail
          # Keep the previous ontology file under a different name so the
          # rename/obsoletion diff below can compare against it -- the main
          # download overwrites data/hp.obo itself.
          cp data/hp.obo /tmp/hp-previous.obo
          base="https://github.com/obophenotype/human-phenotype-ontology/releases/download/v${TAG}"
          # hp.obo is published as hp-base.obo in the release assets and
          # renamed here, because graph_sources looks for hp.obo.
          curl -fsSL "${base}/hp-base.obo" -o data/hp.obo
          curl -fsSL "${base}/genes_to_phenotype.txt" -o data/genes_to_phenotype.txt
          curl -fsSL "${base}/genes_to_disease.txt" -o data/genes_to_disease.txt
          curl -fsSL "${base}/phenotype.hpoa" -o data/phenotype.hpoa

      - name: Record every rename and obsoletion, so no name is ever lost
        if: steps.hpo.outputs.outdated == 'true'
        env:
          TAG: ${{ steps.hpo.outputs.latest }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys
          sys.path.insert(0, "src")
          from melampo.memory.concept_resolution import parse_obo
          from melampo.memory.term_history import TermHistoryStore, diff_releases

          previous = list(parse_obo(open("/tmp/hp-previous.obo", encoding="utf-8", errors="ignore")))
          current = list(parse_obo(open("data/hp.obo", encoding="utf-8", errors="ignore")))

          previous_terms = {t.term_id: t.name for t in previous if t.name}
          current_terms = {t.term_id: t.name for t in current if t.name and not t.obsolete}
          current_obsolete = {t.term_id: None for t in current if t.obsolete}

          renames, obsoletions = diff_releases(
              previous_terms, current_terms, current_obsolete=current_obsolete, release="${{ steps.hpo.outputs.latest }}"
          )

          store = TermHistoryStore(__import__("pathlib").Path("data"))
          n_renames = store.append_renames(renames)
          n_obsoletions = store.append_obsoletions(obsoletions)

          print(f"### Term history\n")
          print(
              f"- **{n_renames} renamed terms** recorded as permanent synonyms in "
              f"`data/term_renames.jsonl` -- the old name will still resolve"
          )
          print(f"- **{n_obsoletions} obsoleted terms** recorded in `data/term_obsoletions.jsonl`")
          if renames:
              print("\n<details><summary>Renamed terms</summary>\n")
              for rename in renames[:50]:
                  print(f"- `{rename.term_id}`: {rename.old_name!r} -> {rename.new_name!r}")
              if len(renames) > 50:
                  print(f"- ... and {len(renames) - 50} more")
              print("</details>")
          PY

      - name: Install and verify against the new data
        if: steps.hpo.outputs.outdated == 'true'
        run: |
          python -m pip install --quiet -e .
          python -m pip install --quiet pytest ruff
          # The whole suite, not a subset: the point of proposing rather than
          # applying is that a reviewer sees a green run against the new data,
          # or sees precisely what broke.
          PYTHONPATH=src python -m pytest -q

      - name: Report what the new release changes
        if: steps.hpo.outputs.outdated == 'true'
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys
          sys.path.insert(0, "src")
          from melampo.memory.graph_sources import load_verification_graph, load_medical_actions

          source = load_verification_graph(require_real_data=True)
          print("### HPO data update\n")
          print(f"- **{source.edge_count:,} edges** across {len(source.graph.concepts()):,} concepts")
          print(f"- {source.detail}")
          actions = load_medical_actions()
          if actions is not None:
              print(f"- MAxO: {actions.coverage_note()}")
          PY

      - name: Open a pull request for the data update
        if: steps.hpo.outputs.outdated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/hpo-data-${{ steps.hpo.outputs.latest }}
          title: "chore: HPO data release ${{ steps.hpo.outputs.latest }}"
          commit-message: "chore: update HPO data to release ${{ steps.hpo.outputs.latest }}"
          author: frankltr <francesco.lucio.lattari@gmail.com>
          body: |
            Automated check found HPO release **${{ steps.hpo.outputs.latest }}**
            (repository currently has ${{ steps.hpo.outputs.current }}).

            The full test suite ran against the new data before this PR was opened.

            **Review before merging.** An HPO release can rename and obsolete
            terms in bulk — the 2026-02-16 release renamed 75 and obsoleted 29 —
            and a renamed term is one the concept graph no longer matches under
            its old label. Check the release notes for renames touching terms
            this project's benches or fixtures name directly.
          labels: data-update

      - name: Check Python dependencies
        id: deps
        if: ${{ github.event_name == 'schedule' || inputs.check_dependencies }}
        run: |
          python -m pip install --quiet -e .
          python -m pip list --outdated --format=json > /tmp/outdated.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          rows = json.loads(pathlib.Path("/tmp/outdated.json").read_text() or "[]")
          print("\n### Outdated Python packages\n")
          if not rows:
              print("None.")
          else:
              print("| Package | Installed | Latest |")
              print("|---|---|---|")
              for row in rows:
                  print(f"| {row['name']} | {row['version']} | {row['latest_version']} |")
              print(
                  "\nReported, not applied: a dependency bump that changes tokenisation or "
                  "numerical behaviour would move bench results, and that belongs in its own "
                  "reviewed change rather than arriving with a data refresh."
              )
          PY

  refresh-literature:
    # A separate job with its own schedule, not folded into check-updates
    # above. HPO releases every 6-10 weeks, which is why that job runs
    # weekly; PubMed and ClinicalTrials.gov content appears daily, and
    # checking it on the same weekly cadence would leave newly published,
    # directly relevant literature unindexed for up to a week. The two
    # sources change at genuinely different rates and get genuinely
    # different schedules rather than one compromise cadence for both.
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.check_literature)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -e .

      - name: Refresh literature for concepts already in the index
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys, pathlib
          sys.path.insert(0, "src")

          # A reversal from an earlier version of this workflow, worth
          # stating directly: that version deliberately did not commit its
          # output, reasoning that "the literature index is runtime state,
          # not a versioned data file". That was true only because no real
          # persistence existed yet -- literature_persistence.py and
          # TrackedConceptStore now exist specifically to survive a restart,
          # and a GitHub Actions runner is itself thrown away after every
          # run. Not committing here would mean every night starts from an
          # empty store again, defeating the entire point of today's work.
          # Growth is modest at this batch size (roughly tens of KB per
          # night) and committing daily is reasonable for now; revisit if
          # the tracked-concept list or batch size grows enough to change
          # that.
          from melampo.connectors.europe_pmc import EuropePmcConnector
          from melampo.connectors.clinical_trials import ClinicalTrialsConnector
          from melampo.memory.literature_index import LiteratureIndex
          from melampo.memory.literature_persistence import persist_all
          from melampo.memory.tracked_concepts import TrackedConceptStore, seed_from_vetting_bench
          from melampo.memory.vector_memory import PersistentJsonlVectorStore
          from melampo.evaluation.vetting_bench import VETTING_CASES

          # Dream-Engine style: bounded, nightly, working through concepts
          # this project has actually reasoned about -- never a crawl of the
          # graph's full ~29,000 concepts, and never all tracked concepts at
          # once. PubMed's unauthenticated rate limit (3 req/s) is what sets
          # the real ceiling on a single run, not how many concepts exist.
          BATCH_SIZE = 20

          concepts_path = pathlib.Path("data/literature_index_concepts.json")
          store = TrackedConceptStore.load(concepts_path)
          if len(store) == 0:
              # First run: seed from the vetting bench's own cases -- ~40
              # concepts already known to matter, so the queue has
              # something meaningful the first night rather than starting
              # empty and waiting for cases or promotions to populate it.
              seed_from_vetting_bench(store, VETTING_CASES)

          batch = store.next_batch(limit=BATCH_SIZE)
          vector_store = PersistentJsonlVectorStore(path=pathlib.Path("data/literature_vectors.jsonl"))
          index = LiteratureIndex()
          pmc_connector, trials_connector = EuropePmcConnector(), ClinicalTrialsConnector()

          pmc_added = trials_added = 0
          for entry in batch:
              pmc_added += pmc_connector.populate(index, entry.concept, max_results=5, store=vector_store)
              trials_added += trials_connector.populate(index, entry.concept, max_results=5, store=vector_store)
              store.mark_refreshed(entry.concept, passage_count=len(index.passages))

          store.save(concepts_path)

          print("### Literature refresh\n")
          print(f"- {len(store)} tracked concepts, {len(batch)} refreshed this run (batch size {BATCH_SIZE})")
          print(f"- {pmc_added} Europe PMC passages, {trials_added} ClinicalTrials.gov passages")
          print(f"- persisted to data/literature_vectors.jsonl ({len(vector_store.records)} total records)")
          if batch:
              print("\n<details><summary>Concepts refreshed this run</summary>\n")
              for entry in batch:
                  print(f"- {entry.concept} (tracked since {entry.added_from})")
              print("</details>")
          PY

      - name: Commit the refreshed tracked-concept list and literature store
        run: |
          git config user.name "frankltr"
          git config user.email "francesco.lucio.lattari@gmail.com"
          git add data/literature_index_concepts.json data/literature_vectors.jsonl
          git diff --staged --quiet || git commit -m "chore: literature refresh $(date -u +%Y-%m-%d)"
          git push

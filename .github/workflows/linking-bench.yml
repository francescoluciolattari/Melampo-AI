name: Linking bench (CIFSYN-style and DeepEL-style, synthetic Italian anatomy)

# Manual trigger only: it makes real, billed OpenRouter calls (embeddings plus
# about 190 x 3 short chat calls per model) and must never fire on every commit.
#
# It informs the choice of linking stages after the encoder bench: does putting
# the candidate into the mention's sentence help (CIFSYN's idea), and does an
# LLM choosing among candidates and validating its choice (DeepEL's idea) beat
# the best encoder alone. Neither published system is run; see
# src/melampo/evaluation/linking_bench.py for what is and is not measured.
# Phrases are synthetic, so no patient data is sent anywhere.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [linker, all, chain, contextual, deepel, sparse]
        default: linker
      encoders:
        description: "Contextual-stage encoders, comma-separated (empty = default three)"
        required: false
        default: ""
      deepel_encoder:
        description: "Encoder for the DeepEL-style and chain stages"
        required: false
        default: "voyage-4-large"
      graph:
        description: "Use the UBERON graph (neighbour check, parent proposal); untick to compare"
        type: boolean
        default: true
      verify:
        description: "Both models read the sentence for every name-only link of a form that can mean more than one thing"
        type: boolean
        default: false

jobs:
  linking:
    name: Linking bench
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: |
          uv sync --locked

      # Ontology distractors for the anatomy linker: UBERON human anatomy (terms
      # with an FMA xref), a pinned release checked against its digest so the
      # pool cannot change between runs without a commit saying so.
      - name: Download UBERON (pinned)
        if: ${{ inputs.mode == 'linker' || inputs.mode == 'all' }}
        run: |
          curl -sSL -o data/linking/uberon-basic.obo \
            https://github.com/obophenotype/uberon/releases/download/v2025-05-28/uberon-basic.obo
          echo "67fa31d176195f27cc92454a58e2a5210e21f4e820a719b4f762911d1e379432  data/linking/uberon-basic.obo" | sha256sum -c -

      - name: Run the bench
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODE: ${{ inputs.mode }}
          ENCODERS: ${{ inputs.encoders }}
          DEEPEL_ENCODER: ${{ inputs.deepel_encoder }}
          USE_GRAPH: ${{ inputs.graph }}
          VERIFY: ${{ inputs.verify }}
        # Inputs go through the environment, never interpolated into the shell line.
        run: |
          args=(--mode "$MODE" --deepel-encoder "$DEEPEL_ENCODER" --out linking_results.json --markdown linking_summary.md)
          if [ -n "$ENCODERS" ]; then args+=(--encoders "$ENCODERS"); fi
          if [ "$USE_GRAPH" = "false" ]; then args+=(--no-graph); fi
          if [ "$VERIFY" = "true" ]; then args+=(--verify); fi
          uv run python scripts/run_linking_bench.py "${args[@]}"

      - name: Summarise results
        if: always()
        run: |
          if [ -f linking_summary.md ]; then cat linking_summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linking-bench-results
          path: |
            linking_results.json
            linking_summary.md

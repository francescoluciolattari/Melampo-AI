name: Source coverage (no model is asked)

# 14 November 2026: how much of the labelled findings, of the concepts HPO lacks and of the common diagnoses of
# imaging each source covers (HPO, SNOMED CT via UMLS for research, NCIt, MeSH, ICD-10-CM, RadLex via BioPortal,
# MONDO, the HPO annotations). No SNOMED CT content is written: only which sources hold a concept.

on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The open sources (HPO, MONDO, HPO annotations)
        run: |
          curl -sSL --fail -o hp.obo https://github.com/obophenotype/human-phenotype-ontology/releases/latest/download/hp.obo
          curl -sSL --fail -o mondo.obo https://purl.obolibrary.org/obo/mondo.obo
          curl -sSL --fail -o phenotype.hpoa https://purl.obolibrary.org/obo/hp/hpoa/phenotype.hpoa
          head -3 hp.obo mondo.obo | grep -E "data-version|==>"
      - name: Count
        env:
          UMLS_API_KEY: ${{ secrets.UMLS_API_KEY }}
          BIOPORTAL_API_KEY: ${{ secrets.BIOPORTAL_API_KEY }}
        run: |
          python3 scripts/source_coverage.py --hpo hp.obo --mondo mondo.obo --hpoa phenotype.hpoa \
            --out source_coverage.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-coverage
          path: source_coverage.json
          retention-days: 30

name: Root model format-adherence bench

# Manual trigger only, deliberately kept out of the push/pull_request path
# that ci.yml runs on. This workflow makes real, billed calls to external
# model providers -- it must never fire on every commit, only when someone
# explicitly asks for a comparison.
on:
  workflow_dispatch: {}

jobs:
  # Reads the candidate roster from the Python source of truth
  # (CANDIDATE_MODELS / all_candidate_names() in the bench script) rather
  # than duplicating the list in YAML, so the matrix below always reflects
  # whatever the script currently declares.
  prepare:
    name: List candidates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidates: ${{ steps.list.outputs.candidates }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: list
        run: echo "candidates=$(python3 scripts/run_format_adherence_bench.py --list-candidates)" >> "$GITHUB_OUTPUT"

  # One job per candidate, run concurrently. This is the fix for a run that
  # previously took over 50 minutes: 21 candidates in sequence, each up to
  # 11 cases x up to 10 iterations x up to 30s per call, meant total time
  # scaled with the size of the roster. In parallel it scales with the
  # slowest single candidate instead.
  bench:
    name: Bench ${{ matrix.candidate }}
    needs: prepare
    runs-on: ubuntu-latest
    # A single candidate's worst case: 11 cases x (60s wall clock + one 30s
    # trailing call) plus one-time 429/400 retry overhead -- comfortably
    # under 20 minutes even maxed out on every case, so 20 minutes covers a
    # real run with margin rather than needing the roster-wide ceiling the
    # old sequential job did.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJson(needs.prepare.outputs.candidates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run this candidate
        id: bench
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        continue-on-error: true
        run: |
          python scripts/run_format_adherence_bench.py \
            --candidate "${{ matrix.candidate }}" \
            --out "result.json"

      - name: Upload this candidate's result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Matrix values can contain characters (a dot in "claude-fable-5.1")
          # that are fine in a filename but safer sanitised for an artifact
          # name; using the job index keeps this simple rather than pulling
          # in a slugify step for one workflow.
          name: candidate-result-${{ strategy.job-index }}
          path: result.json
          retention-days: 90
          if-no-files-found: warn

  combine:
    name: Combine results
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download every candidate's result
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-result-*
          path: all_results
          merge-multiple: false

      - name: Merge into one report
        id: merge
        run: |
          mkdir -p merged_input
          find all_results -name '*.json' -exec cp {} merged_input/ \;
          python scripts/merge_bench_results.py merged_input --out bench_results.json

      - name: Summarise results
        if: always()
        run: |
          if [ ! -f bench_results.json ]; then
            echo "### Bench did not produce a results file" >> "$GITHUB_STEP_SUMMARY"
            echo "The merge step did not write output. Check the 'Merge into one report' step log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          data = json.loads(pathlib.Path("bench_results.json").read_text())
          print("### Root model format-adherence bench\n")
          print(f"**Verdict:** {data.get('verdict', 'n/a')}\n")
          results = data.get("results") or []
          if results:
              print("| Model | Adherence | Completion | Near-miss share |")
              print("|---|---:|---:|---:|")
              for row in results:
                  print(
                      f"| {row['model_name']} | {row['adherence']:.0%} | "
                      f"{row['completion_rate']:.0%} | {row['near_miss_share']:.0%} |"
                  )
              print()
          preflight = data.get("preflight") or {}
          if preflight:
              print("<details><summary>Preflight detail</summary>\n")
              print("| Candidate | Result |")
              print("|---|---|")
              for name, reason in sorted(preflight.items()):
                  print(f"| {name} | {reason} |")
              print("\n</details>\n")
          failures = data.get("merge_failures") or []
          if failures:
              print("<details><summary>Merge failures</summary>\n")
              for item in failures:
                  print(f"- {item}")
              print("\n</details>")
          PY

      - name: Upload merged results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-model-bench-results
          path: bench_results.json
          retention-days: 90
          if-no-files-found: error

      - name: Fail the job if no candidate produced a usable result
        if: always()
        run: |
          python3 -c "
          import json, sys
          data = json.load(open('bench_results.json'))
          if not data.get('results'):
              print('No candidate produced a usable result; see the job summary and artifact.')
              sys.exit(1)
          "

name: Root model format-adherence bench

# Manual trigger only, deliberately kept out of the push/pull_request path
# that ci.yml runs on. This workflow makes real, billed calls to external
# model providers -- it must never fire on every commit, only when someone
# explicitly asks for a comparison.
on:
  workflow_dispatch: {}

jobs:
  bench:
    name: Bench root model candidates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run the bench
        env:
          # Populated from repository secrets. Never printed, never written to
          # a file other than being consumed as an environment variable by the
          # script -- the same discipline as NCBI_API_KEY for the PMC connector.
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/run_format_adherence_bench.py --out bench_results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-model-bench-results
          path: bench_results.json
          retention-days: 90

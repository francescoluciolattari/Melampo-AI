# Risk register (ISO 14971), the source of the table in docs/en/COMPLIANCE_RISK.md and docs/it/COMPLIANCE_RISK.md.
# Every control names the tests that verify it (tests/<file>.py::<test>); scripts/docs_check.py check fails when a
# test does not exist, or when a risk has neither a control nor a reason. Severity and probability are the
# project's first estimate (1 low - 5 high), to be reviewed with a physician; residual risk after the controls.
# Status: controlled | partial (controlled, criterion not yet met) | open (no control yet).
risks:
  - id: R01
    hazard: A finding is attached to the wrong anatomical structure
    situation: The differential and the graph rest on a site the report does not state
    harm: Wrong or missed diagnosis
    severity: 4
    probability: 3
    controls:
      - control: The deterministic reader and the models must agree for a certain finding; otherwise the finding stays in doubt with every reading, and a person decides only a discordance of the document (the principle of doubt, 7 November 2026)
        tests:
          - tests/test_finding_owner.py::test_the_reader_and_the_model_decide_together
          - tests/test_claims_reading.py::test_the_models_one_stream_must_agree_or_it_stays_in_doubt
          - tests/test_claims_reading.py::test_a_finding_said_its_own_but_only_placed_by_its_own_words_stays_in_doubt
          - tests/test_claims_reading.py::test_the_principle_of_doubt
          - tests/test_claims_reading.py::test_the_conclusion_closes_a_doubt_of_reading
          - tests/test_report_document.py::test_a_finding_read_in_the_referral_goes_to_a_person_and_an_indication_is_kept_as_such
          - tests/test_pathology_findings.py::test_the_diagnosis_takes_its_items_and_the_clinical_information_is_the_question
          - tests/test_pathology_findings.py::test_items_of_another_section_are_given_only_when_the_diagnosis_names_one_structure
      - control: A structure the model names is read as the linked one, a part or another with UBERON
        tests:
          - tests/test_claims_reading.py::test_a_part_the_model_names_is_the_structure_when_uberon_gives_it_that_part
          - tests/test_claims_reading.py::test_a_part_the_linked_structure_does_not_have_is_not_made_its_own
          - tests/test_claims_reading.py::test_another_structure_that_reaches_it_is_a_finding_that_involves_it
    measured_by: owner-probe, criterion 1 (VALIDATION.md)
    status: partial
  - id: R02
    hazard: A right finding is removed from its structure
    situation: A real abnormality never reaches the differential
    harm: Missed diagnosis
    severity: 4
    probability: 2
    controls:
      - control: Neither the reader alone nor the models alone set a finding aside
        tests:
          - tests/test_claims_reading.py::test_what_is_of_another_structure_is_set_aside_only_with_the_reader_or_its_relation_words
          - tests/test_statement_reading.py::test_a_type_the_reader_contradicts_goes_to_a_person_and_the_models_alone_set_nothing_aside
    measured_by: owner-probe, criterion 2
    status: controlled
  - id: R03
    hazard: A language model states something the sentence does not say
    situation: An invented finding, measure or structure enters the case
    harm: Wrong diagnosis
    severity: 4
    probability: 3
    controls:
      - control: Every claim must be words copied from the sentence; an answer about other words is not valid
        tests:
          - tests/test_claims_reading.py::test_words_not_in_the_sentence_are_dropped_and_other_marked_words_make_the_answer_invalid
          - tests/test_claims_reading.py::test_a_piece_shortened_with_dots_is_copied_when_every_part_is_there_in_order
          - tests/test_statement_reading.py::test_the_piece_must_be_in_the_sentence
    status: controlled
  - id: R04
    hazard: An absent or negated finding is read as present
    situation: "\"no stones\", \"not enlarged\" become findings"
    harm: Wrong diagnosis, unnecessary tests
    severity: 3
    probability: 2
    controls:
      - control: Assertion detection (negation, possibility, time) on every finding
        tests:
          - tests/test_layered_assertion.py::test_a_paraphrase_of_absence_negates_without_a_negation_word
          - tests/test_claims_reading.py::test_an_absence_listed_as_an_observation_is_an_absence
    status: controlled
  - id: R05
    hazard: A fact of the past is read as a current finding
    situation: "\"history of thyroid surgery\" becomes a current thyroid finding"
    harm: Wrong diagnosis
    severity: 3
    probability: 2
    controls:
      - control: Past facts are attached as history, not as findings
        tests:
          - tests/test_statement_reading.py::test_the_thyroid_gets_its_history_and_the_kidney_its_measure
    status: controlled
  - id: R06
    hazard: A patient's report is sent to a service outside the hospital
    situation: Health data leave the controller's systems
    harm: Breach of confidentiality (GDPR art. 9)
    severity: 5
    probability: 1
    controls:
      - control: The report router refuses an external model for patients' texts
        tests:
          - tests/test_report_router.py::test_an_external_model_is_refused
      - control: Probes reach an external endpoint only for public corpora
        tests:
          - tests/test_role_probe.py::test_an_external_endpoint_needs_public_texts
    status: controlled
  - id: R07
    hazard: Text that is not pseudonymised enters review or training data
    situation: Identifiers are stored or learned
    harm: Breach of confidentiality
    severity: 5
    probability: 1
    controls:
      - control: Review records refuse text that is not pseudonymised
        tests:
          - tests/test_review_feedback.py::test_text_that_is_not_pseudonymised_is_refused
    status: controlled
  - id: R08
    hazard: The system learns from unconfirmed or unfounded labels
    situation: A wrong diagnosis is trained in
    harm: Systematic wrong diagnoses
    severity: 4
    probability: 2
    controls:
      - control: A confirmation without a clinical basis is kept out of training
        tests:
          - tests/test_confirmation_and_merge.py::test_without_a_clinical_basis_the_case_is_kept_but_waits_to_be_declared
      - control: A review answer becomes a label only after a second person confirms it
        tests:
          - tests/test_review_feedback.py::test_only_confirmed_records_train
    status: controlled
  - id: R09
    hazard: Records of another patient are merged or closed with a case
    situation: Findings of two patients mixed
    harm: Wrong diagnosis
    severity: 5
    probability: 1
    controls:
      - control: Matching by exact identifiers; an unrelated patient's record is never swept in
        tests:
          - tests/test_case_confirmation.py::test_an_unrelated_patients_pending_record_is_never_swept_in
          - tests/test_clinical_pipeline_smoke.py::test_a_different_patient_same_date_is_treated_as_a_new_case
    status: controlled
  - id: R10
    hazard: A hypothesis is promoted to knowledge without enough confirmation
    situation: A conjecture becomes a traversable edge of the graph
    harm: Systematic wrong reasoning
    severity: 3
    probability: 2
    controls:
      - control: Too few confirmations do not promote; promotion asks a person
        tests:
          - tests/test_conjecture_ledger.py::test_too_few_confirmations_do_not_promote
          - tests/test_conjecture_ledger.py::test_a_leap_is_not_traversable_before_promotion
    status: controlled
  - id: R11
    hazard: The memory retriever reports evidence when the memory is empty
    situation: Three invented items of evidence support a hypothesis
    harm: Overconfident or wrong diagnosis
    severity: 4
    probability: 4
    controls: []
    no_control_because: Known defect, to fix by an explicit abstention of the retriever (next steps)
    status: open
  - id: R12
    hazard: The exam names one side and the sentence the other
    situation: A finding attached to the wrong side, or a dictation error unnoticed
    harm: Wrong-site diagnosis or procedure
    severity: 4
    probability: 2
    controls:
      - control: A laterality conflict goes to a person, the finding stays where the sentence puts it
        tests:
          - tests/test_claims_reading.py::test_the_exam_on_one_side_and_the_sentence_on_the_other_goes_to_a_person
    status: controlled
  - id: R15
    hazard: A normal or physiological state is read as a finding
    situation: "\"bladder partially filled, anechoic content\" becomes an abnormality of the bladder"
    harm: A false finding in the differential, unnecessary tests
    severity: 3
    probability: 3
    controls:
      - control: The models compare each aspect the sentence describes with the usual one; a model that cannot tell keeps the finding in doubt
        tests:
          - tests/test_claims_reading.py::test_each_aspect_is_compared_with_the_usual_and_the_same_is_normal
      - control: What the models call usual and the reader knows as a deviation of that tissue (HPO, PATO) stays in doubt, with the reader's reading beside the models'
        tests:
          - tests/test_claims_reading.py::test_what_the_models_call_usual_and_the_reader_knows_as_a_deviation_stays_in_doubt
    measured_by: owner-probe, criterion 4 (VALIDATION.md)
    status: partial
  - id: R16
    hazard: A measure is judged against a value the model remembers
    situation: "\"the portal vein measures 16 mm\" judged enlarged or normal from memory, with no source"
    harm: An unfounded abnormality, or a missed one
    severity: 3
    probability: 3
    controls:
      - control: The models compare a measure only with a reference row they are given and cite; the reader recomputes the comparison
        tests:
          - tests/test_reference_values.py::test_a_comparison_the_cited_row_does_not_support_goes_to_a_person
          - tests/test_reference_values.py::test_the_reader_recomputes_the_comparison_of_the_cited_row
      - control: Every reference row has its source, licence and status; only reviewed rows are for clinical use
        tests:
          - tests/test_reference_values.py::test_every_row_of_the_table_has_its_source_and_a_status
    measured_by: owner-probe, measures compared with a reference (VALIDATION.md)
    status: partial
  - id: R17
    hazard: The referral's question or the clinical history is read as a current finding
    situation: "\"signs of heart failure\" in the referral becomes a finding of the heart"
    harm: A finding the exam did not make enters the differential
    severity: 4
    probability: 3
    controls:
      - control: The sections of the report are read (LOINC report sections); a finding read in a section of indication goes to a person, an indication is kept as such
        tests:
          - tests/test_report_document.py::test_a_finding_read_in_the_referral_goes_to_a_person_and_an_indication_is_kept_as_such
          - tests/test_report_document.py::test_the_kinds_of_section_follow_the_loinc_sections_of_a_report
      - control: The conclusion and the sentence before are read; a conclusion or an "its" that gives the finding to another structure goes to a person
        tests:
          - tests/test_report_document.py::test_its_and_the_conclusion_are_checked_against_the_anatomy
    measured_by: owner-probe, criterion 4 (VALIDATION.md)
    status: partial
  - id: R13
    hazard: A performance figure is measured on data the system was tuned on
    situation: The figure overstates the real performance
    harm: The system is trusted beyond what it can do
    severity: 4
    probability: 3
    controls:
      - control: Frozen test splits and fresh samples with labels written before the run
        tests:
          - tests/test_frozen_split.py::test_development_rows_hold_back_frozen_documents_unless_final
      - control: A probe run that loses more than 5% of the answers does not count
        verified_by: scripts/owner_probe.py (lost_answers, valid_for_criteria)
    status: controlled
  - id: R14
    hazard: A language model does not answer, or answers out of format
    situation: A missing answer is read as agreement
    harm: A wrong reading passes unchecked
    severity: 3
    probability: 3
    controls:
      - control: A lost or unreadable answer is "cannot say" and sends the item to a person
        tests:
          - tests/test_statement_reading.py::test_the_models_are_one_stream_and_nothing_gives_way
          - tests/test_form_ambiguity.py::test_a_model_that_does_not_answer_makes_the_verify_check_abstain
    status: controlled
